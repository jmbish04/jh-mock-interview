name = "jh-mock-interview"
main = "src/index.ts"
compatibility_date = "2025-03-07"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[durable_objects]
bindings = [
  { name = "TRANSCRIPT_ROOM", class_name = "TranscriptRoom" }
]

[[migrations]]
tag = "v1-transcript-room"
new_classes = ["TranscriptRoom"]
